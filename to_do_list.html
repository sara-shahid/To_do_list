
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl p-6 sm:p-8">

        <!-- Heading -->
        <h1 class="text-3xl font-bold text-center text-indigo-700 mb-2">
            My To-Do List
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Organize your tasks and get things done.
        </p>

        <!-- Add Task Form -->
        <form id="taskForm" class="flex flex-col sm:flex-row gap-3 mb-4">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                class="flex-1 min-w-0 border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                autocomplete="off"
            >

            <button
                type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition"
            >
                Add Task
            </button>
        </form>

        <!-- Message -->
        <p id="message" class="text-red-600 text-sm mb-3" aria-live="polite"></p>

        <!-- Task Filters -->
        <div class="flex flex-wrap gap-2 mb-5">
            <button data-filter="all"
                class="filter-btn bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">
                All
            </button>

            <button data-filter="active"
                class="filter-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm">
                Pending
            </button>

            <button data-filter="completed"
                class="filter-btn bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm">
                Completed
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

        <!-- Empty State -->
        <p id="emptyMessage" class="text-center text-gray-400 py-8">
            No tasks yet. Add your first task!
        </p>

        <!-- Task Counter -->
        <div class="border-t border-gray-200 mt-5 pt-4 flex items-center justify-between gap-3">
            <p id="taskCount" class="text-sm text-gray-500">
                0 tasks remaining
            </p>

            <button
                id="clearCompleted"
                type="button"
                class="text-sm text-red-600 hover:text-red-800 font-medium"
            >
                Clear Completed
            </button>
        </div>

    </div>

    <script>
        // Select HTML elements
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");
        const emptyMessage = document.getElementById("emptyMessage");
        const message = document.getElementById("message");
        const clearCompleted = document.getElementById("clearCompleted");
        const filterButtons = document.querySelectorAll(".filter-btn");

        // Store tasks and the selected filter
        let tasks = [];
        let currentFilter = "all";
        let nextId = 1;

        // Add a new task
        taskForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const taskText = taskInput.value.trim();

            if (taskText === "") {
                message.textContent = "Please enter a task first.";
                taskInput.focus();
                return;
            }

            tasks.push({
                id: nextId++,
                text: taskText,
                completed: false
            });

            taskInput.value = "";
            message.textContent = "";

            renderTasks();
            taskInput.focus();
        });

        // Display tasks
        function renderTasks() {
            taskList.innerHTML = "";

            const filteredTasks = tasks.filter(function (task) {
                if (currentFilter === "active") {
                    return !task.completed;
                }

                if (currentFilter === "completed") {
                    return task.completed;
                }

                return true;
            });

            filteredTasks.forEach(function (task) {
                const li = document.createElement("li");

                li.className =
                    "flex items-center gap-3 p-4 border border-gray-200 rounded-xl bg-white";

                // Checkbox
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute(
                    "aria-label",
                    "Mark task as completed"
                );

                checkbox.className =
                    "w-5 h-5 accent-indigo-600 cursor-pointer shrink-0";

                checkbox.addEventListener("change", function () {
                    task.completed = checkbox.checked;
                    renderTasks();
                });

                // Task text
                const span = document.createElement("span");
                span.textContent = task.text;

                span.className = "flex-1 min-w-0 break-words";

                if (task.completed) {
                    span.classList.add(
                        "line-through",
                        "text-gray-400"
                    );
                }

                // Delete button
                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "Delete";

                deleteButton.className =
                    "bg-red-100 hover:bg-red-200 text-red-700 px-3 py-2 rounded-lg text-sm shrink-0";

                deleteButton.setAttribute("aria-label", "Delete task");

                deleteButton.addEventListener("click", function () {
                    tasks = tasks.filter(function (item) {
                        return item.id !== task.id;
                    });

                    renderTasks();
                });

                // Add elements to the task item
                li.append(checkbox, span, deleteButton);
                taskList.appendChild(li);
            });

            // Update empty state
            emptyMessage.classList.toggle(
                "hidden",
                filteredTasks.length > 0
            );

            if (filteredTasks.length === 0) {
                if (tasks.length === 0) {
                    emptyMessage.textContent =
                        "No tasks yet. Add your first task!";
                } else if (currentFilter === "active") {
                    emptyMessage.textContent =
                        "No pending tasks.";
                } else if (currentFilter === "completed") {
                    emptyMessage.textContent =
                        "No completed tasks yet.";
                } else {
                    emptyMessage.textContent =
                        "No tasks to display.";
                }
            }

            // Update remaining task count
            const remaining = tasks.filter(function (task) {
                return !task.completed;
            }).length;

            taskCount.textContent =
                remaining + (remaining === 1
                    ? " task remaining"
                    : " tasks remaining");
        }

        // Change task filter
        filterButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                currentFilter = button.dataset.filter;

                filterButtons.forEach(function (btn) {
                    btn.classList.remove(
                        "bg-indigo-600",
                        "text-white"
                    );

                    btn.classList.add(
                        "bg-gray-100",
                        "text-gray-700"
                    );
                });

                button.classList.remove(
                    "bg-gray-100",
                    "text-gray-700"
                );

                button.classList.add(
                    "bg-indigo-600",
                    "text-white"
                );

                renderTasks();
            });
        });

        // Remove all completed tasks
        clearCompleted.addEventListener("click", function () {
            tasks = tasks.filter(function (task) {
                return !task.completed;
            });

            renderTasks();
        });

        // Initial display
        renderTasks();
    </script>

</body>
</html>
